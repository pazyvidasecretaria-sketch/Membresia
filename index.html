<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membresía — Iglesia Evangélica Paz y Vida</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:13px;color:#1a1a1a;background:#f5f5f0}
.app{max-width:780px;margin:20px auto;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e0e0e0}
.hdr{background:#1f7a31;padding:14px 18px;display:flex;align-items:center;gap:12px}
.hdr-txt h1{font-size:14px;font-weight:500;color:#fff;line-height:1.3}
.hdr-txt p{font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px}
.logo-circ{width:46px;height:46px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sync-bar{background:#e8f5e9;border-bottom:1px solid #c8e6c9;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#2e7d32}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4caf50;display:inline-block;margin-right:5px}
.sync-dot.red{background:#e53935}.sync-dot.orange{background:#ff9800}
.nav{display:flex;border-bottom:1px solid #e0e0e0;background:#fff}
.nb{flex:1;padding:10px 4px;border:none;background:none;cursor:pointer;font-size:12px;color:#666;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit}
.nb.on{color:#1f7a31;border-bottom-color:#1f7a31;font-weight:500}
.nb:hover:not(.on){background:#f5f5f0}
.pane{padding:16px;display:none}
.pane.on{display:block}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sc{background:#f5f5f0;border-radius:8px;padding:12px}
.sc-lbl{font-size:11px;color:#666}
.sc-val{font-size:22px;font-weight:500;color:#1f7a31;margin-top:2px}
.sc-sub{font-size:11px;color:#888}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sec-ttl{font-size:14px;font-weight:500}
.btn-p{background:#1f7a31;color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.btn-p:hover{background:#185f26}
.btn-s{background:none;border:1px solid #ccc;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;color:#555;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.btn-s:hover{background:#f5f5f0}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filt input,.filt select{font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a1a;font-family:inherit}
.filt input{width:180px}
.mcard{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:10px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;margin-bottom:7px}
.mcard:hover{border-color:#aaa;background:#f9f9f9}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0}
.av-m{background:#eaf3de;color:#27500a}
.av-f{background:#fbeaf0;color:#72243e}
.mi{flex:1;min-width:0}
.mi-name{font-size:13px;font-weight:500}
.mi-sub{font-size:11px;color:#666;margin-top:1px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:10px;padding:2px 7px;border-radius:20px}
.bdg-g{background:#eaf3de;color:#27500a}
.bdg-b{background:#e3f2fd;color:#0d47a1}
.bdg-o{background:#fff3e0;color:#e65100}
.empty{text-align:center;padding:28px 16px;color:#888}
.fov{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:16px;margin-top:8px}
.fov-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #e0e0e0}
.fov-ttl{font-size:14px;font-weight:500}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg.full{grid-column:1/-1}
.flbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.4px;font-weight:500}
.finp{font-size:13px;padding:7px 9px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a1a;width:100%;font-family:inherit}
.finp:focus{outline:none;border-color:#1f7a31}
.fsec{grid-column:1/-1;font-size:11px;font-weight:500;color:#1f7a31;margin-top:6px;padding-top:8px;border-top:1px solid #e0e0e0}
.fact{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;grid-column:1/-1}
.ficha-wrap{background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin-top:8px}
.ficha-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #e0e0e0}
.ficha-body{padding:18px}
.ficha-top{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid #1f7a31;margin-bottom:14px}
.ficha-church h2{font-size:13px;font-weight:500;color:#1f7a31}
.ficha-church p{font-size:10px;color:#888;margin-top:1px}
.ficha-person{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ficha-pname{font-size:16px;font-weight:500}
.ficha-prole{font-size:11px;color:#666;margin-top:2px}
.fsec-ttl{font-size:10px;font-weight:500;color:#1f7a31;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1f7a31;padding-bottom:3px;margin-bottom:7px;margin-top:12px}
.ffields{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.ff{display:flex;flex-direction:column;gap:1px;padding-bottom:4px;border-bottom:1px solid #f0f0f0}
.ff.full{grid-column:1/-1}
.ff-lbl{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.4px}
.ff-val{font-size:12px;font-weight:500;min-height:16px}
.firma-row{display:flex;gap:20px;margin-top:18px}
.firma-box{flex:1;text-align:center}
.firma-line{border-bottom:1px solid #ccc;height:28px;margin-bottom:4px}
.firma-lbl{font-size:10px;color:#888}
.chart-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.crd{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:13px}
.crd-ttl{font-size:11px;color:#666;margin-bottom:10px;font-weight:500}
.bar-group{display:flex;align-items:flex-end;gap:5px;height:80px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.bar-lbl{font-size:9px;color:#888;text-align:center}
.pie-row{display:flex;align-items:center;gap:12px}
.pie-leg{display:flex;flex-direction:column;gap:5px}
.pie-li{display:flex;align-items:center;gap:6px;font-size:11px;color:#666}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.civil-grid{display:flex;flex-wrap:wrap;gap:7px}
.civil-item{background:#f5f5f0;border-radius:8px;padding:8px 12px;text-align:center;min-width:80px}
.civil-n{font-size:18px;font-weight:500;color:#1f7a31}
.civil-l{font-size:10px;color:#888;margin-top:1px}
@media print{
  .sync-bar,.nav,.ficha-bar,.btn-p,.btn-s{display:none!important}
  .app{border:none;box-shadow:none;margin:0}
  .ficha-wrap{border:none}
}
@media(max-width:500px){
  .sgrid{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}
  .fg.full{grid-column:1}
  .fsec{grid-column:1}
  .fact{grid-column:1}
  .ffields{grid-template-columns:1fr}
  .ff.full{grid-column:1}
  .chart-col{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
  <div class="logo-circ">
    <svg width="30" height="30" viewBox="0 0 80 80" fill="none">
      <path d="M40 12C40 12 22 4 10 16C2 25 6 42 16 50C26 58 40 66 40 66C40 66 54 58 64 50C74 42 78 25 70 16C58 4 40 12 40 12Z" stroke="#1f7a31" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
      <path d="M26 54C26 54 16 59 18 68C18 68 29 65 30 55" stroke="#1f7a31" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="26" y1="54" x2="40" y2="66" stroke="#1f7a31" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="hdr-txt">
    <h1>Iglesia Evangélica Paz y Vida — Alcalá de Henares</h1>
    <p>CIF: R2802887F &nbsp;·&nbsp; Programa de Membresía</p>
  </div>
</div>

<div class="sync-bar" id="sync-bar">
  <span><span class="sync-dot orange" id="sync-dot"></span><span id="sync-txt">Conectando con Google Sheets...</span></span>
  <button class="btn-s" style="padding:3px 9px;font-size:11px" onclick="cargarDatos()"><i class="ti ti-refresh"></i> Sincronizar</button>
</div>

<div class="nav">
  <button class="nb on" id="nb-panel" onclick="go('panel')"><i class="ti ti-layout-dashboard"></i> Panel</button>
  <button class="nb" id="nb-miembros" onclick="go('miembros')"><i class="ti ti-users"></i> Miembros</button>
  <button class="nb" id="nb-stats" onclick="go('stats')"><i class="ti ti-chart-bar"></i> Estadísticas</button>
</div>

<div class="pane on" id="pane-panel">
  <div class="sgrid" id="sgrid"></div>
  <div class="row">
    <span class="sec-ttl">Altas recientes</span>
    <button class="btn-p" onclick="go('miembros');setTimeout(abrirForm,50)"><i class="ti ti-plus"></i> Nuevo miembro</button>
  </div>
  <div id="recent"></div>
</div>

<div class="pane" id="pane-miembros">
  <div class="row">
    <span class="sec-ttl">Todos los miembros</span>
    <button class="btn-p" onclick="abrirForm()"><i class="ti ti-plus"></i> Nuevo miembro</button>
  </div>
  <div class="filt">
    <input type="text" id="q" placeholder="Buscar nombre o DNI..." oninput="renderLista()">
    <select id="fs" onchange="renderLista()">
      <option value="">Todos los géneros</option>
      <option value="Varón">Varón</option>
      <option value="Mujer">Mujer</option>
    </select>
    <select id="fb" onchange="renderLista()">
      <option value="">Bautismo: todos</option>
      <option value="si">Bautizados</option>
      <option value="no">Sin bautismo</option>
    </select>
    <select id="fm" onchange="renderLista()">
      <option value="">Todos los ministerios</option>
      <option value="Alabanza">Alabanza</option>
      <option value="Jóvenes">Jóvenes</option>
      <option value="Niños">Niños</option>
      <option value="Evangelismo">Evangelismo</option>
      <option value="Oración">Oración</option>
      <option value="Diaconado">Diaconado</option>
      <option value="Pastoral">Pastoral</option>
    </select>
  </div>
  <div id="lista"></div>
  <div id="form-area"></div>
  <div id="ficha-area"></div>
</div>

<div class="pane" id="pane-stats">
  <div class="sec-ttl" style="margin-bottom:12px">Estadísticas de membresía</div>
  <div class="chart-col">
    <div class="crd">
      <div class="crd-ttl"><i class="ti ti-users"></i> Por género</div>
      <div class="pie-row"><canvas id="pie1" width="72" height="72"></canvas><div class="pie-leg" id="leg1"></div></div>
    </div>
    <div class="crd">
      <div class="crd-ttl"><i class="ti ti-droplet"></i> Bautismo</div>
      <div class="pie-row"><canvas id="pie2" width="72" height="72"></canvas><div class="pie-leg" id="leg2"></div></div>
    </div>
  </div>
  <div class="crd" style="margin-bottom:10px">
    <div class="crd-ttl"><i class="ti ti-chart-bar"></i> Distribución por edad
      <span style="font-size:10px;margin-left:8px">
        <span style="display:inline-flex;align-items:center;gap:3px"><span class="dot" style="background:#1f7a31"></span>Varones</span>&nbsp;
        <span style="display:inline-flex;align-items:center;gap:3px"><span class="dot" style="background:#993556"></span>Mujeres</span>
      </span>
    </div>
    <div class="bar-group" id="age-bars"></div>
  </div>
  <div class="crd">
    <div class="crd-ttl"><i class="ti ti-heart"></i> Estado civil</div>
    <div class="civil-grid" id="civil-grid"></div>
  </div>
</div>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyFWewt2k4AihTOEQ4VH_40Fe0g1CtyBadkzUPEzBy3JT8-3ePj8oCNNOEVbwGNN4B3/exec';
const COLS = ['id','nombre','apellidos','dni','fnac','sexo','civil','tel','email','dir','fconv','fbaut','ministerio','cargo','proc','falta','notas'];
let DB = [];
let syncing = false;

function setSyncStatus(s, msg) {
  document.getElementById('sync-txt').innerHTML = msg;
  document.getElementById('sync-dot').className = 'sync-dot ' + (s==='ok'?'':s==='error'?'red':'orange');
}

async function cargarDatos() {
  if (syncing) return;
  syncing = true;
  setSyncStatus('orange', 'Cargando datos de Google Sheets...');
  try {
    const res = await fetch(SHEET_URL + '?t=' + Date.now());
    const rows = await res.json();
    DB = rows.length <= 1 ? [] : rows.slice(1).filter(r => r[0]).map(r => {
      const obj = {};
      COLS.forEach((c,i) => obj[c] = r[i] !== undefined ? String(r[i]) : '');
      obj.id = Number(obj.id);
      return obj;
    });
    setSyncStatus('ok', 'Sincronizado · ' + new Date().toLocaleTimeString('es-ES'));
    localStorage.setItem('pv_backup', JSON.stringify(DB));
    renderPanel();
    const a = document.querySelector('.nb.on');
    if (a && a.id==='nb-miembros') renderLista();
    if (a && a.id==='nb-stats') renderStats();
  } catch(e) {
    setSyncStatus('error', 'Error de conexión — usando datos locales');
    try { DB = JSON.parse(localStorage.getItem('pv_backup') || '[]'); } catch(e2){}
    renderPanel();
  }
  syncing = false;
}

async function guardarEnSheets() {
  setSyncStatus('orange', 'Guardando en Google Sheets...');
  const rows = [COLS];
  DB.forEach(m => rows.push(COLS.map(c => m[c] || '')));
  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({action:'save', members: rows}),
      headers: {'Content-Type':'application/json'}
    });
    localStorage.setItem('pv_backup', JSON.stringify(DB));
    setSyncStatus('ok', 'Guardado · ' + new Date().toLocaleTimeString('es-ES'));
  } catch(e) {
    localStorage.setItem('pv_backup', JSON.stringify(DB));
    setSyncStatus('error', 'Sin conexión — guardado localmente');
  }
}

function age(d){ if(!d)return null; const b=new Date(d),n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--; return a; }
function fd(d){ if(!d||d==='')return '—'; const p=d.split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:'—'; }
function ini(m){ return ((m.nombre||'')[0]+(m.apellidos||'')[0]||'').toUpperCase(); }

function go(tab){
  ['panel','miembros','stats'].forEach(t=>{
    document.getElementById('pane-'+t).className='pane'+(t===tab?' on':'');
    document.getElementById('nb-'+t).className='nb'+(t===tab?' on':'');
  });
  if(tab==='panel')renderPanel();
  if(tab==='miembros')renderLista();
  if(tab==='stats')renderStats();
}

function cardHTML(m){
  const a=age(m.fnac);
  return `<div class="mcard" onclick="abrirFicha(${m.id})">
    <div class="av ${m.sexo==='Mujer'?'av-f':'av-m'}">${ini(m)}</div>
    <div class="mi">
      <div class="mi-name">${m.nombre} ${m.apellidos}</div>
      <div class="mi-sub">${[m.sexo,a?a+' años':'',m.civil].filter(Boolean).join(' · ')}${m.dni?' · '+m.dni:''}</div>
      <div class="badges">
        ${m.fbaut?'<span class="bdg bdg-g"><i class="ti ti-droplet" style="font-size:10px"></i> Bautizado/a</span>':''}
        ${m.ministerio?'<span class="bdg bdg-b">'+m.ministerio+'</span>':''}
        ${m.cargo&&m.cargo!=='Miembro activo'?'<span class="bdg bdg-o">'+m.cargo+'</span>':''}
      </div>
    </div>
  </div>`;
}

function renderPanel(){
  const t=DB.length,mv=DB.filter(x=>x.sexo==='Varón').length,mf=DB.filter(x=>x.sexo==='Mujer').length,b=DB.filter(x=>x.fbaut&&x.fbaut!=='').length;
  document.getElementById('sgrid').innerHTML=`
    <div class="sc"><div class="sc-lbl">Total miembros</div><div class="sc-val">${t}</div></div>
    <div class="sc"><div class="sc-lbl">Varones</div><div class="sc-val">${mv}</div><div class="sc-sub">${t?Math.round(mv/t*100)+'%':''}</div></div>
    <div class="sc"><div class="sc-lbl">Mujeres</div><div class="sc-val">${mf}</div><div class="sc-sub">${t?Math.round(mf/t*100)+'%':''}</div></div>
    <div class="sc"><div class="sc-lbl">Bautizados</div><div class="sc-val">${b}</div><div class="sc-sub">${t?Math.round(b/t*100)+'%':''}</div></div>`;
  const rec=[...DB].sort((a,b2)=>b2.id-a.id).slice(0,4);
  document.getElementById('recent').innerHTML=rec.length?rec.map(m=>cardHTML(m)).join(''):
    '<div class="empty"><i class="ti ti-users" style="font-size:26px;display:block;margin-bottom:8px"></i>Sin miembros aún.<br><br><button class="btn-p" onclick="go(\'miembros\');setTimeout(abrirForm,50)"><i class="ti ti-plus"></i> Añadir primer miembro</button></div>';
}

function renderLista(){
  const q=(document.getElementById('q')||{}).value?.toLowerCase()||'';
  const fs=(document.getElementById('fs')||{}).value||'';
  const fb=(document.getElementById('fb')||{}).value||'';
  const fm=(document.getElementById('fm')||{}).value||'';
  let list=DB.filter(m=>{
    if(q&&!((m.nombre+' '+m.apellidos).toLowerCase().includes(q)||(m.dni||'').toLowerCase().includes(q)))return false;
    if(fs&&m.sexo!==fs)return false;
    if(fb==='si'&&(!m.fbaut||m.fbaut===''))return false;
    if(fb==='no'&&m.fbaut&&m.fbaut!=='')return false;
    if(fm&&m.ministerio!==fm)return false;
    return true;
  }).sort((a,b)=>(a.apellidos+a.nombre).localeCompare(b.apellidos+b.nombre));
  document.getElementById('lista').innerHTML=list.length?list.map(m=>cardHTML(m)).join(''):
    '<div class="empty">No se encontraron miembros con esos filtros.</div>';
}

function abrirForm(id){
  const m=id?DB.find(x=>x.id===id):{};
  const v=k=>m[k]||'';
  document.getElementById('form-area').innerHTML=`
    <div class="fov">
      <div class="fov-hdr">
        <span class="fov-ttl">${id?'Editar miembro':'Nuevo miembro'}</span>
        <button class="btn-s" style="padding:5px 9px" onclick="cerrarForm()"><i class="ti ti-x"></i></button>
      </div>
      <div class="fgrid">
        <div class="fsec full"><i class="ti ti-user"></i> Datos personales</div>
        <div class="fg"><span class="flbl">Nombre *</span><input class="finp" id="fn" value="${v('nombre')}" placeholder="Nombre"></div>
        <div class="fg"><span class="flbl">Apellidos *</span><input class="finp" id="fa" value="${v('apellidos')}" placeholder="Apellidos"></div>
        <div class="fg"><span class="flbl">DNI / NIE</span><input class="finp" id="fdni" value="${v('dni')}" placeholder="12345678A"></div>
        <div class="fg"><span class="flbl">Fecha de nacimiento</span><input class="finp" type="date" id="ffn" value="${v('fnac')}"></div>
        <div class="fg"><span class="flbl">Sexo</span><select class="finp" id="fsx"><option value="">—</option><option ${v('sexo')==='Varón'?'selected':''} value="Varón">Varón</option><option ${v('sexo')==='Mujer'?'selected':''} value="Mujer">Mujer</option></select></div>
        <div class="fg"><span class="flbl">Estado civil</span><select class="finp" id="fec"><option value="">—</option>${['Soltero/a','Casado/a','Viudo/a','Divorciado/a'].map(x=>`<option ${v('civil')===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="fg"><span class="flbl">Teléfono</span><input class="finp" id="ftel" value="${v('tel')}" placeholder="600 000 000"></div>
        <div class="fg"><span class="flbl">Email</span><input class="finp" id="femail" value="${v('email')}" placeholder="correo@ejemplo.com"></div>
        <div class="fg full"><span class="flbl">Dirección</span><input class="finp" id="fdir" value="${v('dir')}" placeholder="Calle, número — Alcalá de Henares"></div>
        <div class="fsec full"><i class="ti ti-church"></i> Datos eclesiásticos</div>
        <div class="fg"><span class="flbl">Fecha de conversión</span><input class="finp" type="date" id="fconv" value="${v('fconv')}"></div>
        <div class="fg"><span class="flbl">Fecha de bautismo</span><input class="finp" type="date" id="fbaut" value="${v('fbaut')}"></div>
        <div class="fg"><span class="flbl">Ministerio / Área</span><select class="finp" id="fmin"><option value="">—</option>${['Alabanza','Jóvenes','Niños','Evangelismo','Oración','Diaconado','Pastoral'].map(x=>`<option ${v('ministerio')===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="fg"><span class="flbl">Cargo</span><select class="finp" id="fcar"><option value="">—</option>${['Pastor/a','Diácono/a','Anciano/a','Líder de célula','Coordinador/a','Miembro activo'].map(x=>`<option ${v('cargo')===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="fg"><span class="flbl">Iglesia de procedencia</span><input class="finp" id="fproc" value="${v('proc')}" placeholder="Si viene de otra iglesia"></div>
        <div class="fg"><span class="flbl">Alta en la iglesia</span><input class="finp" type="date" id="falta" value="${v('falta')}"></div>
        <div class="fg full"><span class="flbl">Notas pastorales</span><textarea class="finp" id="fnot" rows="2" placeholder="Observaciones internas...">${v('notas')}</textarea></div>
        <div class="fact">
          <button class="btn-s" onclick="cerrarForm()">Cancelar</button>
          <button class="btn-p" onclick="guardar(${id||0})"><i class="ti ti-device-floppy"></i> Guardar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('ficha-area').innerHTML='';
  document.getElementById('form-area').scrollIntoView({behavior:'smooth',block:'start'});
}

function cerrarForm(){ document.getElementById('form-area').innerHTML=''; }
function gv(id){ return document.getElementById(id)?.value?.trim()||''; }

async function guardar(id){
  const nombre=gv('fn'),apellidos=gv('fa');
  if(!nombre||!apellidos){alert('Nombre y apellidos son obligatorios.');return;}
  const d={nombre,apellidos,dni:gv('fdni'),fnac:gv('ffn'),sexo:gv('fsx'),civil:gv('fec'),tel:gv('ftel'),email:gv('femail'),dir:gv('fdir'),fconv:gv('fconv'),fbaut:gv('fbaut'),ministerio:gv('fmin'),cargo:gv('fcar'),proc:gv('fproc'),falta:gv('falta'),notas:gv('fnot')};
  if(id){const i=DB.findIndex(x=>x.id===id);DB[i]={...DB[i],...d};}
  else{d.id=Date.now();DB.push(d);}
  cerrarForm(); renderLista(); renderPanel();
  await guardarEnSheets();
}

function abrirFicha(id){
  document.getElementById('form-area').innerHTML='';
  const m=DB.find(x=>x.id===id);
  const a=age(m.fnac);
  const num=String(DB.findIndex(x=>x.id===id)+1).padStart(4,'0');
  const isF=m.sexo==='Mujer';
  document.getElementById('ficha-area').innerHTML=`
    <div class="ficha-wrap">
      <div class="ficha-bar">
        <button class="btn-s" style="padding:5px 9px" onclick="document.getElementById('ficha-area').innerHTML=''"><i class="ti ti-arrow-left"></i> Volver</button>
        <div style="display:flex;gap:7px">
          <button class="btn-s" style="padding:5px 9px" onclick="document.getElementById('ficha-area').innerHTML='';abrirForm(${id})"><i class="ti ti-edit"></i> Editar</button>
          <button class="btn-p" style="padding:6px 12px" onclick="window.print()"><i class="ti ti-printer"></i> Imprimir</button>
        </div>
      </div>
      <div class="ficha-body">
        <div class="ficha-top">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:40px;height:40px;background:#eaf3de;border-radius:50%;display:flex;align-items:center;justify-content:center">
              <svg width="24" height="24" viewBox="0 0 80 80" fill="none"><path d="M40 12C40 12 22 4 10 16C2 25 6 42 16 50C26 58 40 66 40 66C40 66 54 58 64 50C74 42 78 25 70 16C58 4 40 12 40 12Z" stroke="#1f7a31" stroke-width="4" fill="none"/><path d="M26 54C26 54 16 59 18 68C18 68 29 65 30 55" stroke="#1f7a31" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
            </div>
            <div class="ficha-church"><h2>Iglesia Evangélica Paz y Vida</h2><p>Alcalá de Henares · CIF: R2802887F</p></div>
          </div>
          <div style="text-align:right;font-size:10px;color:#888">Nº <strong>${num}</strong><br>${new Date().toLocaleDateString('es-ES')}</div>
        </div>
        <div class="ficha-person">
          <div class="av ${isF?'av-f':'av-m'}" style="width:52px;height:52px;font-size:18px">${ini(m)}</div>
          <div>
            <div class="ficha-pname">${m.nombre} ${m.apellidos}</div>
            <div class="ficha-prole">${[m.cargo||'Miembro activo',m.ministerio].filter(Boolean).join(' · ')}</div>
          </div>
        </div>
        <div class="fsec-ttl">Datos personales</div>
        <div class="ffields">
          <div class="ff"><div class="ff-lbl">DNI / NIE</div><div class="ff-val">${m.dni||'—'}</div></div>
          <div class="ff"><div class="ff-lbl">Fecha de nacimiento</div><div class="ff-val">${fd(m.fnac)}${a?' ('+a+' años)':''}</div></div>
          <div class="ff"><div class="ff-lbl">Sexo</div><div class="ff-val">${m.sexo||'—'}</div></div>
          <div class="ff"><div class="ff-lbl">Estado civil</div><div class="ff-val">${m.civil||'—'}</div></div>
          <div class="ff"><div class="ff-lbl">Teléfono</div><div class="ff-val">${m.tel||'—'}</div></div>
          <div class="ff"><div class="ff-lbl">Email</div><div class="ff-val">${m.email||'—'}</div></div>
          <div class="ff full"><div class="ff-lbl">Dirección</div><div class="ff-val">${m.dir||'—'}</div></div>
        </div>

          <div class="ff"><div class="ff-lbl">Fecha de bautismo</div><div class="ff-val">${fd(m.fbaut)}</div></div>

      </div>

function drawPie(cid,data,lid){
  const c=document.getElementById(cid); if(!c)return;
  const ctx=c.getContext('2d');
  const tot=data.reduce((s,d)=>s+d.v,0);
  if(!tot){document.getElementById(lid).innerHTML='<span style="font-size:11px;color:#888">Sin datos</span>';return;}
  let ang=-Math.PI/2;
  ctx.clearRect(0,0,72,72);
  data.forEach(d=>{
    const sl=(d.v/tot)*2*Math.PI;
    ctx.beginPath();ctx.moveTo(36,36);ctx.arc(36,36,34,ang,ang+sl);ctx.closePath();
    ctx.fillStyle=d.c;ctx.fill();ang+=sl;
  });
  document.getElementById(lid).innerHTML=data.map(d=>`<div class="pie-li"><div class="dot" style="background:${d.c}"></div>${d.l}: <strong>${d.v}</strong> (${Math.round(d.v/tot*100)}%)</div>`).join('');
}

function renderStats(){
  const t=DB.length;
  const mv=DB.filter(x=>x.sexo==='Varón').length,mf=DB.filter(x=>x.sexo==='Mujer').length;
  drawPie('pie1',[{l:'Varones',v:mv,c:'#1f7a31'},{l:'Mujeres',v:mf,c:'#993556'},{l:'Sin datos',v:t-mv-mf,c:'#B4B2A9'}].filter(x=>x.v>0),'leg1');
  const b=DB.filter(x=>x.fbaut&&x.fbaut!=='').length;
  drawPie('pie2',[{l:'Bautizados',v:b,c:'#1f7a31'},{l:'Sin bautismo',v:t-b,c:'#B4B2A9'}].filter(x=>x.v>0),'leg2');
  const ranges=[['0-12',0,12],['13-17',13,17],['18-29',18,29],['30-45',30,45],['46-60',46,60],['60+',61,200]];
  const mData=ranges.map(([,lo,hi])=>DB.filter(x=>x.sexo==='Varón'&&age(x.fnac)>=lo&&age(x.fnac)<=hi).length);
  const fData=ranges.map(([,lo,hi])=>DB.filter(x=>x.sexo==='Mujer'&&age(x.fnac)>=lo&&age(x.fnac)<=hi).length);
  const mx=Math.max(...mData,...fData,1);
  document.getElementById('age-bars').innerHTML=ranges.map(([lbl],i)=>`
    <div class="bar-col">
      <div style="font-size:9px;color:#888">${mData[i]+fData[i]||''}</div>
      <div style="display:flex;gap:2px;align-items:flex-end;width:100%;height:64px">
        <div style="flex:1;background:#1f7a31;border-radius:3px 3px 0 0;height:${Math.max(2,Math.round(mData[i]/mx*64))}px"></div>
        <div style="flex:1;background:#993556;border-radius:3px 3px 0 0;height:${Math.max(2,Math.round(fData[i]/mx*64))}px"></div>
      </div>
      <div class="bar-lbl">${lbl}</div>
    </div>`).join('');
  const cc={};DB.forEach(m=>{if(m.civil)cc[m.civil]=(cc[m.civil]||0)+1;});
  document.getElementById('civil-grid').innerHTML=Object.entries(cc).map(([k,v])=>`<div class="civil-item"><div class="civil-n">${v}</div><div class="civil-l">${k}</div></div>`).join('')||'<span style="font-size:12px;color:#888">Sin datos registrados</span>';
}

cargarDatos();
</script>
